name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --- Next.js type check ---
  frontend:
    name: Frontend (TypeScript check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install --legacy-peer-deps
      - run: npx tsc --noEmit

  # --- FastAPI tests ---
  backend:
    name: Backend (Python tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short || true  # soft-fail until tests are written

  # --- Daily data scrape via cron ---
  scrape:
    name: Hourly AQI scrape (fallback)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r apps/api/requirements.txt
      - run: python agents/data_scraper.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}

  # --- Daily retrain cron ---
  retrain:
    name: Daily model retrain
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r packages/ml/requirements.txt
      - run: python packages/ml/src/model.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
