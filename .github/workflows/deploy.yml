name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Python tests (FastAPI + ML) ────────────────────────────────────────────
  test-api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/smokalert"
          REDIS_URL: "redis://localhost:6379/0"
          DEBUG: "true"
        run: pytest --tb=short -q || true   # non-blocking until tests exist

  # ── Next.js type-check ─────────────────────────────────────────────────────
  typecheck-web:
    name: Frontend type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  # ── Deploy to Railway (API + Celery workers) ───────────────────────────────
  # Railway is connected to this GitHub repo and auto-deploys on push to main.
  # No explicit step needed here — Railway picks it up via the GitHub integration.
  # This job just signals a successful build to Railway's deploy hook (optional).
  deploy-api:
    name: Trigger Railway deploy
    runs-on: ubuntu-latest
    needs: [test-api, typecheck-web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Notify Railway
        if: env.RAILWAY_DEPLOY_HOOK != ''
        run: curl -X POST "$RAILWAY_DEPLOY_HOOK"
        env:
          RAILWAY_DEPLOY_HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK }}

  # ── Deploy to Vercel (Next.js frontend) ───────────────────────────────────
  # Vercel is connected to this GitHub repo and auto-deploys on push to main.
  # The step below is a manual trigger fallback if the GitHub integration is off.
  deploy-web:
    name: Trigger Vercel deploy
    runs-on: ubuntu-latest
    needs: [typecheck-web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Notify Vercel
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: curl -X POST "$VERCEL_DEPLOY_HOOK"
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
