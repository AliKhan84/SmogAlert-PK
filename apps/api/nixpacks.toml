[phases.setup]
nixPkgs = ["python312", "python312Packages.pyarrow", "gcc", "libffi", "zlib"]

[phases.install]
cmds = [
  # Create venv and install packages (pyarrow comes from Nix, not pip)
  "pip install --no-cache-dir -r requirements.txt",
  # Make Nix-installed pyarrow accessible inside the venv by symlinking
  "python -c \"import site; print(site.getsitepackages())\"",
]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT"
