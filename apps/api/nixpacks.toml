[phases.setup]
# Install pyarrow via Nix so it's available system-wide before pip runs.
# pip-installed pyarrow sometimes fails to build wheels on Railway's Nix environment.
nixPkgs = ["python312", "python312Packages.pyarrow", "gcc", "libffi", "zlib"]

[phases.install]
# Install all requirements. pyarrow is already in the Nix environment so pip
# will find it via the linked site-packages and skip re-installation.
cmds = ["pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT"
